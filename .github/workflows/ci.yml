name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.21.0
      - run: shards install
      # ameba is pinned to the v1.7.0-dev tag, which ships no postinstall hook,
      # so its binary must be built explicitly. bin/ is gitignored, hence mkdir.
      - run: mkdir -p bin && crystal build lib/ameba/src/cli.cr -o bin/ameba
      - run: crystal tool format --check
      - run: ./bin/ameba
      - run: crystal spec
